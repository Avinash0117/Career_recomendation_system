# Render Blueprint — deploy from Git repo root (this file lives next to career-recommendation-system/).
# After deploy, set CORS_ORIGINS in the Render dashboard to your frontend origin(s), comma-separated.

version: "1"

services:
  - type: web
    name: careerpath-api
    runtime: docker
    rootDir: career-recommendation-system/backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
